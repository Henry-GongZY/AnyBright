name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish (self-contained, IL-trimmed, win-x64)
        run: dotnet publish App -c Release -p:Platform=x64 -r win-x64 --self-contained true -p:PublishTrimmed=true -p:Version=${{ steps.ver.outputs.version }} -o publish/out-x64

      - name: Publish (self-contained, IL-trimmed, win-arm64)
        run: dotnet publish App -c Release -p:Platform=ARM64 -r win-arm64 --self-contained true -p:PublishTrimmed=true -p:Version=${{ steps.ver.outputs.version }} -o publish/out-arm64

      - name: Stage portable packages (app + CLI scripts)
        shell: pwsh
        run: |
          foreach ($arch in @('x64', 'arm64')) {
            New-Item -ItemType Directory -Force -Path "staging/AnyBright" | Out-Null
            Copy-Item "publish/out-$arch/*" "staging/AnyBright" -Recurse -Force
            Copy-Item cli/brightness.ps1, cli/bright.cmd -Destination staging/AnyBright -Force
            Compress-Archive -Path staging/AnyBright -DestinationPath "AnyBright-${{ steps.ver.outputs.version }}-win-$arch-portable.zip" -Force
            Remove-Item "staging/AnyBright" -Recurse -Force
          }

      - name: Build installers (Inno Setup)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc /DMyAppVersion=${{ steps.ver.outputs.version }} installer/AnyBright.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # arm64 setup needs Inno >= 6.3; refresh if the preinstalled copy is older
          & $iscc /DMyAppVersion=${{ steps.ver.outputs.version }} /DIsArm64 installer/AnyBright.iss
          if ($LASTEXITCODE -ne 0) {
            choco install innosetup -y --no-progress --force
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.ver.outputs.version }} /DIsArm64 installer/AnyBright.iss
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload portable zips
        uses: actions/upload-artifact@v4
        with:
          name: AnyBright-${{ steps.ver.outputs.version }}-portable
          path: AnyBright-*-portable.zip
          if-no-files-found: error

      - name: Upload installers
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: AnyBright-${{ steps.ver.outputs.version }}-setup
          path: installer/Output/*.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AnyBright-*-portable.zip
            installer/Output/*.exe
          generate_release_notes: true
